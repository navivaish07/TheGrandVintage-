<div class="auth-overlay">
  <div class="auth-card">
    <button class="close-x" (click)="closeModal()">✕</button>

    <div class="auth-heading">
      <h2>Welcome to <span>The Grand Vintage</span></h2>
      <p>Luxury dining and private access await.</p>
    </div>

    <div class="tabs">
      <button [class.active]="showLogin" (click)="toggle('login')">Login</button>
      <button [class.active]="!showLogin" (click)="toggle('signup')">Sign Up</button>
    </div>

    <div class="auth-form">
      <form *ngIf="showLogin" (ngSubmit)="signIn()">
        <label>Email</label>
        <input [(ngModel)]="loginData.email" name="loginEmail" required placeholder="you@example.com" />
        <label>Password</label>
        <input [(ngModel)]="loginData.password" name="loginPassword" required type="password" placeholder="••••••" />
        <button class="btn-royal" type="submit">Sign In</button>
      </form>

      <form *ngIf="!showLogin" (ngSubmit)="signUp()">
        <label>Email</label>
        <input [(ngModel)]="signupData.email" name="signupEmail" required placeholder="you@example.com" />
        <label>Password</label>
        <input [(ngModel)]="signupData.password" name="signupPassword" required type="password" placeholder="••••••" />
        <label>Confirm Password</label>
        <input [(ngModel)]="signupData.confirm" name="signupConfirm" required type="password" placeholder="••••••" />
        <button class="btn-royal" type="submit">Create Account</button>
      </form>
    </div>
  </div>
</div>
