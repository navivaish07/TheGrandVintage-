<div class="auth-overlay">
  <div class="auth-card card">
    <button class="close-x" (click)="closeModal()">✕</button>

    <h2>Welcome to <span style="color:var(--gold)">The Grand Vintage</span></h2>
    <div class="tabs" style="margin-top:16px; display:flex; gap:8px;">
      <button [class.active]="showLogin" (click)="toggle('login')" class="btn-royal">Login</button>
      <button [class.active]="!showLogin" (click)="toggle('signup')" class="btn-royal">Sign Up</button>
    </div>

    <div style="margin-top:18px;">
      <!-- LOGIN FORM -->
      <form *ngIf="showLogin" (ngSubmit)="signIn()">
        <label class="kicker">Email</label>
        <input [(ngModel)]="loginData.email" name="loginEmail" required placeholder="you@example.com" />
        <label class="kicker">Password</label>
        <input [(ngModel)]="loginData.password" name="loginPassword" required type="password" placeholder="••••••" />
        <button class="btn-royal" type="submit" style="margin-top:12px;">Sign In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form *ngIf="!showLogin" (ngSubmit)="signUp()">
        <label class="kicker">Full Name</label>
        <input [(ngModel)]="signupData.name" name="signupName" required placeholder="Your name" />
        <label class="kicker">Email</label>
        <input [(ngModel)]="signupData.email" name="signupEmail" required placeholder="you@example.com" />
        <label class="kicker">Password</label>
        <input [(ngModel)]="signupData.password" name="signupPassword" required type="password" placeholder="••••••" />
        <label class="kicker">Confirm Password</label>
        <input [(ngModel)]="signupData.confirm" name="signupConfirm" required type="password" placeholder="••••••" />
        <button class="btn-royal" type="submit" style="margin-top:12px;">Create Account</button>
      </form>
    </div>
  </div>
</div>
