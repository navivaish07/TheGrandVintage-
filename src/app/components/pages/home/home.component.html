<div class="home-container">
  <h1>{{ title }}</h1>
  <p class="subtitle">Experience royal dining with us ✨</p>

  <div class="highlights">
    <div class="highlight-card" *ngFor="let item of highlights">
      <span class="icon">{{ item.icon }}</span>
      <span>{{ item.text }}</span>
    </div>
  </div>

  <div class="cta">
    <button class="btn-royal">Explore Menu</button>
    <button class="btn-outline">See Reviews</button>
  </div>
</div>
