<div class="about-container">
  <h1>About Us</h1>
  <p class="story">{{ story }}</p>

  <div class="highlight-section">
    <div class="highlight-card" *ngFor="let item of highlights">
      <span class="icon">{{ item.icon }}</span>
      <p>{{ item.text }}</p>
    </div>
  </div>

  <div class="vision">
    <h2>Our Vision</h2>
    <p>
      To create unforgettable dining experiences where tradition meets innovation, 
      and every guest feels like royalty.
    </p>
  </div>
</div>
